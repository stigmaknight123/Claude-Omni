name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check proxy syntax
        run: node --check zen-proxy.mjs
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n verify.sh
          bash -n start.sh
          bash -n bin/claude-omni
          bash -n completions/claude-omni.bash
